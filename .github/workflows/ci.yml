name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck / lint / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The lib/bin targets link against webkit2gtk/gtk on Linux even when no
      # desktop bundle is produced, so the dev packages are required for
      # `cargo test --lib` / clippy. No `pnpm tauri build` happens in CI.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev build-essential

      # The action installs the toolchain and caches the cargo registry plus
      # src-tauri/target via rust-cache (the target dir is not at the repo root).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-workspaces: src-tauri -> target

      # NOTE: these gates are intentionally blocking. The repository still has
      # pre-existing rustfmt drift and a few clippy warnings that are being
      # burned down; they must be fixed rather than silenced with `-A` flags.
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --no-deps -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

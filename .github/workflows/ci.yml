name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck / lint / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The lib/bin targets link against webkit2gtk/gtk on Linux even when no
      # desktop bundle is produced, so the dev packages are required for
      # `cargo test --lib` / clippy. No `pnpm tauri build` happens in CI.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev build-essential

      # The action installs the toolchain and caches the cargo registry plus
      # src-tauri/target via rust-cache (the target dir is not at the repo root).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-workspaces: src-tauri -> target

      # tauri-build validates bundle.externalBin resources even for lib/test
      # builds. The real sidecar is produced by the release workflow, so CI only
      # needs a placeholder at the expected triple-suffixed path.
      - name: Placeholder sidecar resource
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/aide-mcp-$TRIPLE"

      # NOTE: these gates are intentionally blocking. The repository still has
      # pre-existing rustfmt drift and a few clippy warnings that are being
      # burned down; they must be fixed rather than silenced with `-A` flags.
      - name: Format check (app + core)
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/core/Cargo.toml --check

      - name: Clippy (app + core)
        run: |
          status=0
          cargo clippy --manifest-path src-tauri/Cargo.toml --lib --no-deps -- -D warnings 2>&1 | tee /tmp/clippy-app.log || status=1
          cargo clippy --manifest-path src-tauri/core/Cargo.toml --lib --bins --no-deps -- -D warnings 2>&1 | tee /tmp/clippy-core.log || status=1
          if [ "$status" -ne 0 ]; then
            {
              echo '### Clippy failure'
              echo '```'
              grep -E "^(error|warning)(\[|:)" -A 6 /tmp/clippy-app.log /tmp/clippy-core.log | head -200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Also emit annotations (readable via the check-runs API) so the
            # first failing lint is visible without downloading logs.
            grep -hE "^(error|warning)(\[|:)" /tmp/clippy-app.log /tmp/clippy-core.log \
              | head -20 | sed 's/^/::error::/' || true
            exit 1
          fi

      - name: Build sidecar target
        # The app crate's build script requires the externalBin placeholder,
        # which only exists during a release build; the sidecar lives in the
        # core crate and can be checked standalone.
        run: cargo check --manifest-path src-tauri/core/Cargo.toml --bins

      - name: Test (app + core)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo test --manifest-path src-tauri/core/Cargo.toml --lib

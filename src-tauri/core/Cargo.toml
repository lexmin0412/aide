[package]
name = "aide-core"
version = "0.3.0"
edition = "2021"
description = "Headless domain logic for aide: skills, tool sync, MCP, models, git scopes"
authors = ["you"]

[lib]
name = "aide_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = "0.8"
dirs = "6"
trash = "5"
ureq = "2"
flate2 = "1"
tar = "0.4"
